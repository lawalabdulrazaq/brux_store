<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Join the Elite | Brux Abode</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="auth-page">
        <div class="auth-container luxury-card"data-aos="zoom-in">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join our exclusive circle of luxury real estate.</p>

            <form id="register-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-username" placeholder="Enter your name" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" placeholder="email@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="@**&#$%^&" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Register</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="login.html">Log in here</a>.</p>
        </div>
        <script src="auth-logic.js"></script>
    </body>
</html>
